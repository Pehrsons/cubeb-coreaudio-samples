[package]
name = "cubeb-coreaudio-samples"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2.5"
debug_tree = "0.4"
cubeb-backend = "0.34"
cubeb-coreaudio = { git = "https://github.com/mozilla/cubeb-coreaudio-rs", rev = "840f69c1b3f95accd582555e10abcef8ee67514b", features = [
    "audio-dump",
] }

[features]
# On by default to match Firefox. Build with --no-default-features to compare against a backend
# that does not force VPIO for the built-in mic.
default = ["vpio-forcelist"]
vpio-forcelist = ["cubeb-coreaudio/vpio-forcelist"]
# Zero every Rust allocation, to test whether a behaviour depends on reading uninitialized memory.
# Only covers allocations made by Rust; see src/zeroing_malloc.c for the process-wide version.
zeroing-alloc = []

[dependencies.clap]
features = ["derive"]
version = "4.5"

[dependencies.coreaudio-sys]
default-features = false
features = ["audio_unit", "core_audio", "io_kit_audio"]
version = "0.2.18"


[build-dependencies]
cc = "1.0"
